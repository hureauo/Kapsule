server {
    listen 80;
    server_name _;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    access_log off;

    ssl_certificate     /etc/nginx/certs/borne.crt;
    ssl_certificate_key /etc/nginx/certs/borne.key;

    # Uploads vidéo jusqu'à 600 MB
    client_max_body_size 600M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src blob:; frame-ancestors 'none';" always;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longs pour les gros uploads vidéo
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;

        # Pas de buffering : Nginx transfère les chunks au fur et à mesure
        # (sinon il charge tout le fichier en RAM avant de l'envoyer au backend)
        proxy_request_buffering off;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # SPA fallback : toute URL inconnue renvoie index.html (React Router gère côté client)
        try_files $uri $uri/ /index.html;
    }
}
