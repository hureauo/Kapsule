services:
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
    # Les dépendances natives (better-sqlite3) nécessitent python3/make/g++ pour la compilation
    entrypoint: sh -c "apk add --no-cache python3 make g++ && \"$$@\"" --
    command: ["npm", "test"]
