# Borne d'essai (aperçu distant client, §6D).
#
# Usage prod (auto) : créé par le backend Hub via docker.sock à la création d'événement.
#   Le nom de container `preview-<slug>` est déterministe : l'edge nginx route
#   essai-<slug>.kapsule.hureau.com → preview-<slug>:80 sans reload.
#
# Usage debug / lancement manuel :
#   BOX_TOKEN_PREVIEW=<token> PREVIEW_SLUG=monnom JWT_SECRET=$(openssl rand -hex 32) \
#   docker compose -f docker-compose.preview.yml -p preview-monnom up -d
#
# BOX_TOKEN_PREVIEW : token d'essai généré depuis le Hub (is_preview=1).
# PREVIEW_SLUG      : identifiant DNS-safe (ex: "mariage-dupont") — nom du container.
# HUB_URL           : URL interne ou publique du Hub.
#                     → En interne (même serveur) : http://hub-backend:3001
#                     → En externe : https://hub.tondomaine.com
# JWT_SECRET        : optionnel — vide/non fourni, resolveJwtSecret() en génère et persiste
#                     un au premier démarrage (Phase C). MAIS à fixer explicitement à LA MÊME
#                     valeur que le JWT_SECRET du Hub pour tout usage réel : POST
#                     /api/events/:id/preview/token (Hub) signe les liens "preview_url" partagés
#                     au client avec le secret du HUB — si la preview en génère un différent,
#                     la borne rejette ces liens en 401 (pas juste "sessions invalidées", ils ne
#                     vérifient jamais). Le provisioner de production (provisioner.js) le fait
#                     déjà automatiquement ; en lancement manuel, le fournir soi-même.

services:
  borne-preview-backend:
    build:
      context: .
      dockerfile: apps/borne/server/Dockerfile
    environment:
      - BOX_TOKEN=${BOX_TOKEN_PREVIEW}
      - MAX_DATA_BYTES=1073741824
      - PREVIEW_MODE=true
      - HUB_URL=${HUB_URL:-http://hub-backend:3001}
      - JWT_SECRET=${JWT_SECRET:-}
      - DATA_DIR=/app/data
      - PORT=3001
    volumes:
      - borne-preview-data:/app/data
    networks:
      - preview_internal
      - hub_net
    restart: unless-stopped

  borne-preview-frontend:
    # Nom déterministe : l'edge nginx résout "preview-<slug>" via le DNS Docker.
    # En lancement manuel : PREVIEW_SLUG doit correspondre au slug utilisé dans l'URL.
    container_name: preview-${PREVIEW_SLUG:-debug}
    build:
      context: .
      dockerfile: apps/borne/web/Dockerfile.preview
    # Pas de ports exposés : l'edge proxy fait le routing par Host.
    depends_on:
      - borne-preview-backend
    networks:
      - preview_internal
      - hub_net
    restart: unless-stopped

volumes:
  borne-preview-data:

networks:
  preview_internal:
    driver: bridge

  # Réseau créé par le Hub — on s'y attache sans le recréer.
  # Nom fixe défini dans docker-compose.hub.yml (indépendant du projet Docker).
  hub_net:
    external: true
    name: kapsule_hub_net
