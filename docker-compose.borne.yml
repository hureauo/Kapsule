services:
  backend:
    build:
      context: .
      dockerfile: apps/borne/server/Dockerfile
    environment:
      - NODE_ENV=production
      # Vide, PAS "change-me" : un placeholder publiquement connu (visible dans
      # ce fichier versionné) injecté dans le conteneur serait une valeur faible
      # DE PLUS à traiter — resolveJwtSecret() traite déjà la chaîne vide comme
      # absente et en génère une au premier démarrage (WEAK_JWT_SECRETS).
      - JWT_SECRET=${JWT_SECRET:-}
      - HUB_URL=${HUB_URL:-}
      - BOX_TOKEN=${BOX_TOKEN:-}
      # Phase B : identité de borne physique (machine persistante, plusieurs
      # événements assignés) — distincte de BOX_TOKEN (token = événement,
      # réservé aux bornes d'essai). Seed uniquement : une fois en base
      # (borne_settings), la rotation depuis /borne (onglet Identité) prime.
      - BORNE_TOKEN=${BORNE_TOKEN:-}
      - DATA_DIR=/app/data
      - PORT=3001
      - PULL_INTERVAL_MS=${PULL_INTERVAL_MS:-300000}
      - MAX_DATA_BYTES=${MAX_DATA_BYTES:-}
      - PREVIEW_MODE=${PREVIEW_MODE:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-}
    volumes:
      # Un seul volume : registry.sqlite (identité machine — local_events,
      # push_state, borne_settings) ET events/<id>/ (données invité) y
      # cohabitent, comme avant Phase B. Un split en deux volumes a été
      # envisagé puis abandonné (revue Phase B) : monter un second volume
      # nommé sur le sous-chemin events/ MASQUE silencieusement les données
      # déjà présentes à cet endroit sur une borne existante (elles restent
      # sur le disque mais deviennent invisibles pour l'app) — et même sur un
      # déploiement neuf, un simple `docker volume rm` du sous-volume ne
      # nettoie pas les lignes local_events/push_state du registre : ce
      # n'aurait jamais été un vrai raccourci de purge. La purge RGPD de
      # référence reste exclusivement applicative : POST /api/sync/purge/:id
      # (confirmation par nom), qui ferme le handle SQLite, supprime le
      # dossier et nettoie le registre de façon cohérente.
      - borne_data:/app/data
    networks:
      - internal
    restart: unless-stopped

  frontend:
    # Build multi-stage : Vite → nginx:alpine + openssl (sera complété en phase 1b)
    build:
      context: .
      dockerfile: apps/borne/web/Dockerfile
    ports:
      # Paramétrables (déf. 80/443) — utile pour faire tourner plusieurs
      # instances sur la même machine (ex. smoke test à côté d'un déploiement
      # réel) sans conflit de port.
      - "${BORNE_HTTP_PORT:-80}:80"
      - "${BORNE_HTTPS_PORT:-443}:443"
    volumes:
      - borne_certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

volumes:
  borne_data:
  borne_certs:

networks:
  internal:
    driver: bridge
