services:
  backend:
    build:
      context: .
      dockerfile: apps/hub/server/Dockerfile
    # Le nom de container fixe permet aux bornes preview de le joindre par ce nom
    # depuis le réseau hub_net : http://hub-backend:3001
    container_name: hub-backend
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - DATA_DIR=/app/data
      - PORT=3001
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD_HUB=${ADMIN_PASSWORD_HUB:-}
    ports:
      - "3001:3001"
    volumes:
      - hub_data:/app/data
    networks:
      - hub_net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/hub/server/Dockerfile
    command: ["node", "src/worker/index.js"]
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - DATA_DIR=/app/data
    volumes:
      - hub_data:/app/data
    networks:
      - hub_net
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/hub/web/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Prod : monter les certificats Let's Encrypt depuis l'hôte.
      # Dev local : si fullchain.pem est absent, l'entrypoint génère un cert auto-signé.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - hub_net
    restart: unless-stopped

volumes:
  hub_data:

networks:
  # Réseau interne Hub. Nommé avec `name:` fixe pour être indépendant du
  # nom de projet Docker Compose. Les bornes preview s'y attachent via
  # `external: true / name: kapsule_hub_net` dans docker-compose.preview.yml.
  hub_net:
    driver: bridge
    name: kapsule_hub_net
