services:
  backend:
    build:
      context: .
      dockerfile: apps/hub/server/Dockerfile
    # Le nom de container fixe permet aux bornes preview de le joindre par ce nom
    # depuis le réseau hub_net : http://hub-backend:3001
    container_name: hub-backend
    environment:
      # NODE_ENV=production : sans lui, validateConfig() (apps/hub/server/src/config.js)
      # ne devient jamais strict — un JWT_SECRET absent/faible ne fait que
      # produire un warning console, jamais un refus de démarrer, même sur un
      # Hub Internet-facing (l'inverse de docker-compose.borne.yml:7, qui le
      # pose déjà).
      - NODE_ENV=production
      # Vide, PAS "change-me" : un placeholder publiquement connu (visible dans
      # ce fichier versionné) serait une valeur faible DE PLUS à traiter, et
      # sans NODE_ENV=production ci-dessus, un JWT_SECRET manquant passait
      # inaperçu — désormais le démarrage est refusé (validateConfig).
      - JWT_SECRET=${JWT_SECRET:-}
      - DATA_DIR=/app/data
      - PORT=3001
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD_HUB=${ADMIN_PASSWORD_HUB:-}
      - EDGE_DOMAIN=${EDGE_DOMAIN:-kapsule.hureau.com}
      - PREVIEW_IMAGE=${PREVIEW_IMAGE:-kapsule-borne-preview-frontend}
      - PREVIEW_BACKEND_IMAGE=${PREVIEW_BACKEND_IMAGE:-kapsule-borne-preview-backend}
      - HUB_URL_INTERNAL=${HUB_URL_INTERNAL:-http://hub-backend:3001}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-Kapsule <noreply@kapsule.hureau.com>}
    # Pas de `ports:` ici — le chemin légitime est edge → hub-frontend →
    # backend:3001, entièrement sur le réseau interne kapsule_hub_net
    # (README.md le documente déjà comme "interne"). Publier 3001 sur l'hôte
    # court-circuite l'edge (pas de TLS, ni HSTS/CSP/X-Frame) et, combiné à
    # `trust proxy: 1` fixe (apps/hub/server/src/index.js), permet à un client
    # direct de forger X-Forwarded-For pour contourner le rate-limit login.
    volumes:
      - hub_data:/app/data
      # Monté pour l'auto-provisioning des containers preview (Partie C).
      # Donne au backend un accès Docker équivalent root sur l'hôte —
      # acceptable ici car le Hub est de confiance (périmètre contrôlé).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hub_net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/hub/server/Dockerfile
    command: ["node", "src/worker/index.js"]
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      - DATA_DIR=/app/data
    volumes:
      - hub_data:/app/data
    networks:
      - hub_net
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/hub/web/Dockerfile
    # Nom fixe résolu par le DNS Docker : l'edge nginx fait proxy_pass http://hub-frontend
    container_name: hub-frontend
    # Plus de ports exposés ni de TLS : le service edge prend en charge 80/443.
    depends_on:
      - backend
    networks:
      - hub_net
    restart: unless-stopped

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    ports:
      - "80:80"
      - "443:443"
    environment:
      - EDGE_DOMAIN=${EDGE_DOMAIN:-kapsule.hureau.com}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
    networks:
      - hub_net
    restart: unless-stopped

volumes:
  hub_data:

networks:
  # Réseau interne Hub. Nommé avec `name:` fixe pour être indépendant du
  # nom de projet Docker Compose. Les bornes preview s'y attachent via
  # `external: true / name: kapsule_hub_net` dans docker-compose.preview.yml.
  hub_net:
    driver: bridge
    name: kapsule_hub_net
